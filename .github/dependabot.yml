version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      # vitest and every @vitest/* package declare an EXACT peer on each other
      # ("peer vitest@4.1.11 from @vitest/coverage-v8@4.1.11"), so they can only
      # move together. This group is listed FIRST because a dependency joins the
      # first group it matches, and it carries no update-types so that majors
      # come through it too. The development-dependencies group below is capped
      # at minor/patch, which pushed vitest 5.0.0 out into one PR per package.
      # Each of those PRs alone is an unresolvable peer tree and npm ci dies
      # with ERESOLVE before a single test runs.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      # github/codeql-action/init and /analyze must always be on the same
      # version. Ungrouped, Dependabot opens one PR per sub-action and
      # merging only one of them breaks CodeQL with
      # "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns:
          - 'github/codeql-action*'
