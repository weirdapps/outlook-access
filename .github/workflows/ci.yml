name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build (tsc)
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Tests should not need real auth: they use mocks/fixtures, and the
          # tracked outlook-cli.env holds only non-secret runtime knobs.
          CI: 'true'

  pii-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: PII gauntlet
        run: bash scripts/pii-gauntlet.sh
