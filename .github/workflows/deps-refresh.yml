name: Monthly Dependency Refresh
'on':
  schedule:
    - cron: '47 5 12 * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    uses: weirdapps/shared-workflows/.github/workflows/deps-refresh.yml@738cb3809962f7a025db67266dad072166b7549b  # main
    with:
      node_version: '22'
      # Node 22 ships npm 10.x, whose Arborist crashes on some dependency
      # graphs during `npm update`: "Cannot read properties of null (reading
      # 'edgesOut')" at #loadPeerSet. That took the sharepoint-access refresh
      # down on 2026-09-10 (weirdapps/sharepoint-access#15) on the same npm.
      # Pre-emptive here: this repo's graph does not trigger it today, but the
      # graph is exactly what dependabot keeps moving. Upgrade npm rather than
      # node, so the gate keeps running on the version this repo targets.
      setup_cmd: npm install -g npm@11
      gate_cmd: npm run lint && npm run build && npm test
    secrets: inherit
